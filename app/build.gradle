 */

plugins {
    // Apply the application plugin to add support for building a CLI application in Java.
    id 'application'
}

repositories {
    // Use Maven Central for resolving dependencies.
    mavenCentral()
}

dependencies {
    // Use JUnit test framework.
    testImplementation libs.junit

    // This dependency is used by the application.
    implementation libs.guava

    // Jackson for JSON <-> Java object mapping.
    implementation libs.jackson.databind
    implementation 'at.favre.lib:bcrypt:0.10.2'
}

// Apply a specific Java toolchain to ease working on different environments.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(8)
    }
}

application {
    // Define the main class for the application.
    mainClass = 'ticket.booking.App'
}

run {
    // Start the program from the project root (not the app/ folder), so relative paths like
    // "app/src/main/java/ticket/booking/localDB/users.json" point to the right file.
    workingDir = rootProject.projectDir
    // Pass your keyboard input through to the program, so Scanner can read it.
    standardInput = System.in
}
